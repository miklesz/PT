<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Podstawowe zagadnienia sieciowe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/white.css">
    <style>
      :root { --pt-blue: #003b70; --pt-cyan: #007c91; --pt-ink: #13212e; --pt-muted: #587083; }
      .reveal { color: var(--pt-ink); font-family: Arial, Helvetica, sans-serif; font-size: 34px; }
      .reveal .slides { text-align: left; }
      .reveal h1, .reveal h2, .reveal h3 { color: var(--pt-blue); font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 0; text-transform: none; }
      .reveal h1 { font-size: 1.75em; margin-bottom: 0.35em; }
      .reveal h2 { font-size: 1.3em; margin-bottom: 0.55em; }
      .reveal p, .reveal li { line-height: 1.32; }
      .reveal ul { margin-top: 0.25em; }
      .reveal li + li { margin-top: 0.25em; }
      .reveal a { color: var(--pt-cyan); text-decoration: underline; }
      .reveal strong { color: var(--pt-blue); }
      .reveal img { display: block; max-height: 48vh; max-width: 78%; margin: 0.6em auto 0; object-fit: contain; border: 0; box-shadow: none; }
      .reveal video { display: block; width: min(76vw, 980px); max-height: 58vh; margin: 0.55em auto 0; }
      .reveal .video-embed { display: block; width: min(76vw, 980px); aspect-ratio: 16 / 9; margin: 0.55em auto 0; border: 0; }
      .reveal .video-link { display: grid; place-items: center; width: min(76vw, 980px); aspect-ratio: 16 / 9; margin: 0.55em auto 0; overflow: hidden; position: relative; background: #111; text-decoration: none; }
      .reveal .video-link img { width: 100%; max-width: none; max-height: none; height: 100%; margin: 0; object-fit: cover; }
      .reveal .video-link span { position: absolute; bottom: 1em; padding: 0.42em 0.8em; color: #fff; background: var(--pt-blue); font-size: 0.62em; font-weight: 700; }
      .reveal .title-slide { text-align: center; }
      .reveal .title-slide h1 { font-size: 1.9em; }
      .reveal .title-slide p { color: var(--pt-muted); }
      .reveal .section-slide { display: grid !important; place-content: center; text-align: center; }
      .reveal .section-slide h1, .reveal .section-slide h2 { font-size: 2em; }
      .reveal .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2em; align-items: start; }
      .reveal .small { font-size: 0.72em; }
      .reveal .credits { color: var(--pt-muted); font-size: 0.52em; margin-top: 0.35em; }
      .reveal .stack { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.22em; margin: 0.35em auto; max-width: 950px; }
      .reveal .stack > div { border: 2px solid var(--pt-blue); padding: 0.35em 0.18em; min-height: 4.3em; display: grid; place-content: center; text-align: center; font-size: 0.55em; }
      .reveal .stack .tcp { grid-column: span 3; background: #dceef2; }
      .reveal .stack .net { background: #e7edf6; }
      .reveal .stack .link { grid-column: span 2; background: #eff0df; }
      .reveal .packet { display: flex; margin: 0.7em auto; max-width: 850px; border: 2px solid var(--pt-blue); font-size: 0.7em; }
      .reveal .packet span { padding: 0.45em 0.75em; border-right: 2px solid var(--pt-blue); text-align: center; flex: 1; }
      .reveal .packet span:last-child { border-right: 0; flex: 2; }
      .reveal .shared-medium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8em 1.3em; align-items: end; max-width: 1000px; margin: 0.8em auto 0; }
      .reveal .radio-station { display: grid; justify-items: center; gap: 0.16em; font-size: 0.62em; }
      .reveal .radio-station .node { width: 4.4em; height: 3.1em; position: relative; display: grid; place-content: center; border: 4px solid var(--station); background: #fff; color: var(--station); font-weight: 700; }
      .reveal .radio-station .node::before { content: ''; position: absolute; top: -1.2em; left: calc(50% - 2px); width: 4px; height: 1.2em; background: var(--station); }
      .reveal .radio-station .node::after { content: ''; position: absolute; top: -1.7em; left: calc(50% - 1.1em); width: 2.2em; height: 1.1em; border: 3px solid var(--station); border-bottom: 0; border-radius: 50% 50% 0 0; }
      .reveal .radio-station .role { color: var(--pt-muted); font-size: 0.82em; }
      .reveal .station-a { --station: #007c91; }
      .reveal .station-b { --station: #b35c2e; }
      .reveal .station-c { --station: #4f7f3d; }
      .reveal .shared-channel { grid-column: 1 / -1; order: -1; min-height: 3.1em; display: grid; place-content: center; position: relative; overflow: hidden; color: #fff; background: #003b70; font-size: 0.68em; font-weight: 700; }
      .reveal .shared-channel .channel-title { position: relative; z-index: 1; padding: 0.18em 0.55em; background: #003b70; }
      .reveal .shared-channel::before { content: ''; position: absolute; z-index: 0; left: 7%; right: 7%; top: 50%; border-top: 3px solid #85c4d0; }
      .reveal .shared-channel::after { content: 'ramka ze stacji A'; position: absolute; left: 18%; top: calc(50% - 1.45em); padding: 0.32em 0.6em; background: #007c91; font-size: 0.72em; font-weight: 700; }
      .reveal .hidden-terminal { position: relative; display: grid; grid-template-columns: 1fr 1.2fr 1fr; grid-template-rows: 1fr 1fr; gap: 1.7em 1.1em; align-items: center; max-width: 880px; min-height: 8.3em; margin: 0.8em auto 0; }
      .reveal .hidden-node { position: relative; z-index: 2; padding: 0.65em 0.55em; border: 3px solid var(--pt-blue); background: #fff; color: var(--pt-blue); font-size: 0.68em; font-weight: 700; text-align: center; }
      .reveal .hidden-node.access-point { grid-area: 1 / 2; border-color: #b35c2e; color: #8a421e; }
      .reveal .hidden-node.station-left { grid-area: 2 / 1; border-color: #007c91; color: #006779; }
      .reveal .hidden-node.station-right { grid-area: 2 / 3; border-color: #4f7f3d; color: #3d672e; }
      .reveal .hidden-terminal .radio-link { position: absolute; z-index: 0; top: 54%; width: 33%; border-top: 5px solid #85c4d0; transform-origin: center; }
      .reveal .hidden-terminal .link-a { left: 18%; transform: rotate(-29deg); }
      .reveal .hidden-terminal .link-b { right: 18%; transform: rotate(29deg); }
      .reveal .hidden-link { grid-area: 2 / 1 / 3 / 4; align-self: end; z-index: 1; margin: 0 15%; padding-top: 0.55em; border-top: 3px dashed #b54b4b; color: #9a3030; background: #fff; font-size: 0.48em; font-weight: 700; text-align: center; }
      .reveal .convolutional-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr) auto minmax(0, 1.1fr) auto minmax(0, 1fr); align-items: stretch; gap: 0.18em; max-width: 1080px; margin: 0.85em auto; }
      .reveal .convolutional-flow .flow-step { display: grid; align-content: center; gap: 0.22em; min-height: 5.3em; padding: 0.45em; border: 2px solid var(--pt-blue); background: #fff; color: var(--pt-text); font-size: 0.46em; text-align: center; }
      .reveal .convolutional-flow .flow-step strong { color: var(--pt-blue); }
      .reveal .convolutional-flow .flow-step code { color: #8a421e; font-size: 1.08em; }
      .reveal .convolutional-flow .flow-step small { color: var(--pt-muted); font-size: 0.92em; }
      .reveal .convolutional-flow .flow-arrow { display: grid; place-content: center; color: #007c91; font-size: 1em; font-weight: 700; }
      .reveal .convolutional-circuit { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 0.35em; align-items: center; max-width: 980px; margin: 0.65em auto; }
      .reveal .convolutional-circuit .tap { display: grid; gap: 0.22em; min-height: 3.65em; padding: 0.45em; border: 3px solid #007c91; background: #fff; color: #006779; font-size: 0.5em; text-align: center; }
      .reveal .convolutional-circuit .input-tap { border-color: #b35c2e; color: #8a421e; }
      .reveal .convolutional-circuit .tap small { color: var(--pt-muted); font-size: 0.88em; }
      .reveal .convolutional-circuit .circuit-arrow { color: #007c91; font-size: 1em; font-weight: 700; }
      .reveal .convolutional-circuit .generator-output { grid-column: span 2; display: grid; gap: 0.25em; min-height: 3.8em; padding: 0.48em 0.65em; border: 3px solid var(--pt-blue); background: #edf5fa; color: var(--pt-text); font-size: 0.48em; text-align: left; }
      .reveal .convolutional-circuit .generator-output strong { color: var(--pt-blue); }
      .reveal .convolutional-circuit .generator-output code { color: #8a421e; }
      .reveal .convolutional-example { max-width: 1020px; margin: 0.55em auto; }
      .reveal .convolutional-example .register-label { margin-bottom: 0.45em; color: var(--pt-muted); font-size: 0.46em; text-align: center; }
      .reveal .convolutional-example .register-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 0.28em; align-items: center; max-width: 740px; margin: 0 auto 0.55em; }
      .reveal .convolutional-example .register-row > span { color: #007c91; font-weight: 700; }
      .reveal .convolutional-example .register-cell { display: grid; gap: 0.18em; min-height: 3.35em; padding: 0.38em; border: 3px solid #007c91; background: #fff; color: #006779; font-size: 0.48em; text-align: center; }
      .reveal .convolutional-example .register-cell.input { border-color: #b35c2e; color: #8a421e; }
      .reveal .convolutional-example .register-cell small { color: var(--pt-muted); font-size: 0.85em; }
      .reveal .convolutional-example .generator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em; }
      .reveal .convolutional-example .generator-card { display: grid; gap: 0.32em; min-height: 4.1em; padding: 0.48em 0.65em; border: 3px solid var(--pt-blue); background: #edf5fa; color: var(--pt-text); font-size: 0.45em; text-align: center; }
      .reveal .convolutional-example .generator-card strong { color: var(--pt-blue); }
      .reveal .convolutional-example .generator-card div { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.3em; }
      .reveal .convolutional-example .generator-card code { padding: 0.12em 0.26em; background: #fff; color: #8a421e; }
      .reveal .convolutional-example .generator-card b { color: #007c91; }
      .reveal .hdb3-wave { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.16em; align-items: end; max-width: 760px; height: 5.1em; margin: 0.65em auto 0.38em; }
      .reveal .hdb3-cell { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 5.1em; padding: 0 0.25em 0.38em; border-bottom: 3px solid #627789; color: var(--pt-text); font-size: 0.64em; text-align: center; }
      .reveal .hdb3-cell strong, .reveal .hdb3-cell span { position: relative; z-index: 1; justify-self: center; background: #fff; }
      .reveal .hdb3-cell strong { align-self: start; padding: 0.08em 0.32em; }
      .reveal .hdb3-cell span { padding: 0.1em 0.25em 0; color: var(--pt-muted); font-size: 0.7em; }
      .reveal .hdb3-cell::before { content: ''; position: absolute; z-index: 0; bottom: 0; left: 50%; width: 0; height: 0; border-left: 0.34em solid transparent; border-right: 0.34em solid transparent; transform: translateX(-50%); }
      .reveal .hdb3-cell.pulse-b::before, .reveal .hdb3-cell.pulse-v::before { height: 3.5em; border-left: 0.34em solid #43a9b4; border-right: 0.34em solid #43a9b4; background: #43a9b4; }
      .reveal .hdb3-cell.pulse-b { color: #006779; }
      .reveal .hdb3-cell.pulse-v { color: #a23d3d; }
      .reveal .hdb3-cell.pulse-v::before { border-left-color: #df8181; border-right-color: #df8181; background: #df8181; }
      .reveal .hdb3-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65em; max-width: 790px; margin: 0.1em auto 0; color: var(--pt-muted); font-size: 0.4em; }
      .reveal .hdb3-legend > div { display: grid; grid-template-columns: auto 1fr; gap: 0.4em; align-items: center; padding: 0.35em 0.5em; border-top: 2px solid #cfd9de; text-align: left; }
      .reveal .hdb3-legend strong { color: var(--pt-blue); font-size: 1.25em; }
      .reveal .hdb3-wave-svg { display: block; width: min(100%, 820px); max-height: 35vh; margin: 0.15em auto 0; overflow: visible; }
      .reveal .hdb3-wave-svg .axis { stroke: #7b8790; stroke-width: 3; }
      .reveal .hdb3-wave-svg .wave { fill: none; stroke: #007c91; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
      .reveal .hdb3-wave-svg text { fill: var(--pt-text); font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .reveal .hdb3-wave-svg .level { fill: var(--pt-muted); font-size: 23px; font-weight: 400; }
      .reveal .hdb3-wave-svg .label-b { fill: #007c91; font-size: 35px; }
      .reveal .hdb3-wave-svg .label-v { fill: #b54b4b; font-size: 35px; }
      .reveal .encoding-benefit { display: grid; grid-template-columns: 1fr auto 1fr auto 1.35fr; gap: 0.35em; align-items: center; max-width: 930px; margin: 0.8em auto; }
      .reveal .encoding-benefit .benefit-step { display: grid; justify-items: center; align-content: center; gap: 0.45em; min-height: 5.2em; padding: 0.45em; border: 2px solid var(--pt-blue); background: #fff; color: var(--pt-text); font-size: 0.47em; text-align: center; }
      .reveal .encoding-benefit .benefit-step strong { color: var(--pt-blue); }
      .reveal .encoding-benefit .benefit-arrow { color: #007c91; font-size: 1.15em; font-weight: 700; }
      .reveal .encoding-benefit .bit-token, .reveal .encoding-benefit .benefit-mark { display: grid; place-content: center; min-width: 2.1em; min-height: 1.65em; padding: 0.1em 0.3em; background: #f8eadf; color: #8a421e; font-family: monospace; font-size: 1.15em; font-weight: 700; }
      .reveal .encoding-benefit .benefit-mark { border-radius: 50%; background: #e4f0e7; color: #3d672e; font-family: Arial, sans-serif; }
      .reveal .encoding-benefit .bit-pair { display: flex; gap: 0.28em; }
      .reveal .encoding-benefit .bit-pair span { padding: 0.28em 0.38em; background: #e5f1f4; color: #006779; font-family: monospace; font-size: 0.95em; font-weight: 700; }
      .reveal .code-lab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7em; align-items: end; max-width: 900px; margin: 0.8em auto; }
      .reveal .code-lab label { display: grid; gap: 0.28em; color: var(--pt-blue); font-size: 0.58em; font-weight: 700; }
      .reveal .code-lab input, .reveal .code-lab select { width: 100%; box-sizing: border-box; padding: 0.38em 0.5em; border: 2px solid var(--pt-blue); border-radius: 0; background: #fff; color: var(--pt-ink); font: 700 1.1em ui-monospace, SFMono-Regular, Menlo, monospace; }
      .reveal .code-lab select { font-family: Arial, sans-serif; }
      .reveal .code-lab .lab-result { grid-column: 1 / -1; min-height: 3.2em; padding: 0.55em 0.7em; border-left: 6px solid var(--pt-cyan); background: #edf5fa; color: var(--pt-ink); font-size: 0.58em; line-height: 1.35; }
      .reveal .code-lab .lab-result code { padding: 0.12em 0.28em; background: #fff; color: #8a421e; font-size: 1.06em; }
      .reveal .two-of-five-lab { grid-template-columns: minmax(230px, 0.8fr) 1.4fr; }
      .reveal .convolutional-lab { grid-template-columns: 1fr; }
      .reveal .coax-layout { display: grid; grid-template-columns: minmax(260px, 0.8fr) 1.2fr; gap: 1.1em; align-items: center; }
      .reveal .coax-cross-section { position: relative; width: 250px; aspect-ratio: 1; margin: 0 auto 0.35em; border-radius: 50%; background: #27333b; }
      .reveal .coax-cross-section div { position: absolute; border-radius: 50%; display: grid; place-content: center; }
      .reveal .coax-insulation { inset: 12%; background: #e8e4c7; }
      .reveal .coax-shield { inset: 25%; background: repeating-radial-gradient(circle, #7b8790 0 3px, #c6ccd0 4px 6px); }
      .reveal .coax-core { inset: 40%; background: #bd6b2d; }
      .reveal .coax-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 0.28em 0.6em; font-size: 0.55em; }
      .reveal .coax-legend span::before { content: ''; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.35em; vertical-align: -0.05em; border-radius: 50%; }
      .reveal .coax-legend .outer::before { background: #27333b; }
      .reveal .coax-legend .shield::before { background: #8c979d; }
      .reveal .coax-legend .insulation::before { background: #e8e4c7; }
      .reveal .coax-legend .core::before { background: #bd6b2d; }
      .reveal .fiber-layout { display: grid; grid-template-columns: minmax(260px, 0.8fr) 1.2fr; gap: 1.1em; align-items: center; }
      .reveal .fiber-cross-section { position: relative; width: 250px; aspect-ratio: 1; margin: 0 auto 0.35em; border-radius: 50%; background: #293b46; }
      .reveal .fiber-cross-section div { position: absolute; border-radius: 50%; display: grid; place-content: center; }
      .reveal .fiber-cladding { inset: 13%; background: #c6e4e7; }
      .reveal .fiber-core { inset: 37%; background: #f2be58; }
      .reveal .fiber-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3em; font-size: 0.55em; text-align: center; }
      .reveal .fiber-legend span::before { content: ''; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.3em; vertical-align: -0.05em; border-radius: 50%; }
      .reveal .fiber-legend .coating::before { background: #293b46; }
      .reveal .fiber-legend .cladding::before { background: #c6e4e7; }
      .reveal .fiber-legend .core::before { background: #f2be58; }
      .reveal .network-scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45em; align-items: end; max-width: 980px; min-height: 270px; margin: 0.75em auto 0; padding: 0 0.25em 0.45em; border-bottom: 3px solid var(--pt-blue); }
      .reveal .network-scale > div { display: grid; place-content: center; text-align: center; padding: 0.35em; color: #fff; font-size: 0.64em; line-height: 1.15; }
      .reveal .network-scale strong { color: inherit; font-size: 1.25em; }
      .reveal .network-scale .pan { min-height: 3.4em; background: #007c91; }
      .reveal .network-scale .lan { min-height: 5.1em; background: #0071a8; }
      .reveal .network-scale .man { min-height: 6.8em; background: #4f7f3d; }
      .reveal .network-scale .wan { min-height: 8.6em; background: #b35c2e; }
      .reveal .p2p-diagram { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 0.45em; align-items: center; max-width: 860px; margin: 0.65em auto 0.85em; }
      .reveal .p2p-node { display: grid; place-content: center; min-height: 3.2em; padding: 0.35em; border: 3px solid var(--pt-blue); background: #fff; color: var(--pt-blue); font-size: 0.6em; font-weight: 700; text-align: center; }
      .reveal .p2p-link { position: relative; display: grid; place-content: center; min-height: 3.2em; color: #006779; font-size: 0.52em; font-weight: 700; text-align: center; }
      .reveal .p2p-link::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 5px solid #007c91; }
      .reveal .p2p-link span { position: relative; padding: 0.22em 0.45em; background: #fff; }
      .reveal .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65em 1em; margin: 0.55em auto; max-width: 1050px; }
      .reveal .comparison-grid > div { border-left: 6px solid var(--pt-cyan); padding: 0.25em 0.55em; font-size: 0.72em; }
      .reveal .comparison-grid strong { display: block; margin-bottom: 0.12em; }
      .reveal .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5em; align-items: end; margin: 1em auto 0; max-width: 1050px; border-bottom: 3px solid var(--pt-blue); }
      .reveal .timeline > div { min-height: 8em; padding: 0.55em 0.35em; display: grid; align-content: center; background: #e7edf6; text-align: center; font-size: 0.65em; border-top: 6px solid var(--pt-cyan); }
      .reveal .timeline > div:nth-child(2) { min-height: 9.2em; background: #dceef2; }
      .reveal .timeline > div:nth-child(3) { min-height: 10.4em; background: #eff0df; }
      .reveal .timeline > div:nth-child(4) { min-height: 11.6em; background: #f4e6d5; }
      .reveal .wifi-speed-chart { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.45em; align-items: end; max-width: 1080px; height: 10em; margin: 0.3em auto 0; padding: 0 0.1em; border-bottom: 3px solid var(--pt-blue); }
      .reveal .wifi-speed-chart > div { display: flex; flex-direction: column; justify-content: end; align-items: stretch; height: 100%; text-align: center; }
      .reveal .wifi-speed-chart .rate { min-height: 1.45em; display: grid; place-content: end center; color: var(--pt-blue); font-size: 0.46em; font-weight: 700; }
      .reveal .wifi-speed-chart .bar { height: var(--bar-height); min-height: 0.35em; background: var(--bar-color); border-top: 5px solid var(--bar-border); }
      .reveal .wifi-speed-chart strong { margin-top: 0.35em; font-size: 0.45em; }
      .reveal .wifi-speed-chart .year { color: var(--pt-muted); font-size: 0.4em; }

# Podstawowe zagadnienia sieciowe

---

## Plan wykładu

- definicja i funkcje sieci komputerowej,
- rodzaje sieci,
- topologie fizyczne i logiczne,
- topologie: punkt-punkt, magistrala, pierścień, gwiazda, hierarchia i siatka.

---

## Sieć komputerowa

Sieć komputerowa to zbiór połączonych urządzeń, które wymieniają dane i współdzielą zasoby według ustalonych protokołów.

Możliwa jest między innymi komunikacja użytkowników, dostęp do usług, współdzielenie plików, urządzeń i połączenia z Internetem.

---

## Rodzaje sieci

<div class="network-scale">
  <div class="pan"><strong>PAN</strong>osobista<br><small>telefon, zegarek</small></div>
  <div class="lan"><strong>LAN / WLAN</strong>lokalna<br><small>dom, biuro, budynek</small></div>
  <div class="man"><strong>MAN</strong>miejska<br><small>kampus, miasto</small></div>
  <div class="wan"><strong>WAN</strong>rozległa<br><small>kraje, kontynenty</small></div>
</div>

Podział zależy przede wszystkim od zasięgu i sposobu zarządzania infrastrukturą.

---

# Topologie

---

## Jak czytać topologie?

Topologia opisuje układ połączeń między urządzeniami, a nie tylko ich położenie na rysunku.

![Przykładowe topologie sieci](media/image3.png)

---

## Topologia punkt-punkt

<div class="p2p-diagram">
  <div class="p2p-node">Węzeł A</div><div class="p2p-link"><span>dedykowane łącze</span></div><div class="p2p-node">Węzeł B</div>
</div>

<div class="columns"><div>

**Łącze stałe**

Zestawione na stałe między tymi samymi dwoma punktami.

</div><div>

**Łącze komutowane**

Tworzone na żądanie przez sieć pośrednią, a po zakończeniu zwalniane.

</div></div>

---

## Topologia liniowa

Węzły są połączone kolejno; urządzenia pośrednie przekazują ruch dalej.

![Topologia liniowa](media/image5.png)

Awaria przewodu albo urządzenia pośredniego może odłączyć dalszą część łańcucha.

---

## Topologia magistrali

<div class="packet"><span>A</span><span>Wspólny kabel</span><span>B</span><span>Wspólny kabel</span><span>C</span></div>

- Wszystkie stacje współdzielą medium.
- Prosta i historycznie tania, ale podatna na kolizje oraz awarię wspólnego segmentu.
- Klasyczny Ethernet koncentryczny był przykładem takiej topologii.

![Topologia magistrali](media/image6.png)

---

## Materiał: magistrala

<video controls preload="metadata" poster="media/image7.png"><source src="media/slide-021-media1.mp4" type="video/mp4"></video>

---

## Topologia pierścienia

<div class="packet"><span>A → B</span><span>B → C</span><span>C → D</span><span>D → A</span></div>

- Dane przechodzą kolejno przez węzły.
- W pierścieniu podwójnym drugi kierunek może zapewniać redundancję.
- Przykładem historycznym był Token Ring.

![Topologia pierścienia](media/image8.png)

---

## Materiał: pierścień

<video controls preload="metadata" poster="media/image9.png"><source src="media/slide-024-media2.mp4" type="video/mp4"></video>

---

## Pierścień podwójny

Dwa niezależne kierunki transmisji mogą utrzymać łączność po przerwaniu jednego z odcinków.

![Topologia pierścienia podwójnego](media/image10.png)

---

## Topologia gwiazdy

- Wszystkie urządzenia łączą się z centralnym punktem.
- Awaria pojedynczego kabla zwykle odcina tylko jedno urządzenie.
- Awaria punktu centralnego wpływa na całą sieć.

<div class="packet"><span>Host A</span><span>Przełącznik</span><span>Host B</span><span>Host C</span></div>

![Topologia gwiazdy](media/image11.png)

---

## Koncentrator a przełącznik

<div class="columns"><div>

**Koncentrator (hub)**

Powiela sygnał do wszystkich portów; medium pozostaje współdzielone.

</div><div>

**Przełącznik (switch)**

Kieruje ramkę do właściwego portu; umożliwia równoległą komunikację.

</div></div>

---

## Materiał: gwiazda z koncentratorem

## Materiał: gwiazda z MSAU

---

## Topologie hierarchiczne

- Łączą mniejsze topologie w większą strukturę.
- Przykłady: pierścień-gwiazda, gwiazda-magistrala, magistrala-drzewo.
- Ułatwiają skalowanie, segmentację i zarządzanie dużą siecią.

<div class="media-gallery">

---

## Topologia siatki

<div class="columns"><div>

**Częściowa siatka**

Tylko najważniejsze węzły mają wiele połączeń. To kompromis między kosztem i redundancją.

</div><div>

**Pełna siatka**

Każdy węzeł łączy się z każdym. Zapewnia wysoką odporność, ale liczba łączy rośnie bardzo szybko.

</div></div>

<div class="media-gallery">
  <img src="media/image18.png" alt="Częściowa topologia siatki">
  <img src="media/image19.png" alt="Pełna topologia siatki">
  <img src="media/image26.png" alt="Liczba połączeń w pełnej siatce">
</div>

---

## Wybór topologii

Zależy od:

- wymaganej niezawodności,
- liczby urządzeń,
- kosztu okablowania i sprzętu,
- łatwości rozbudowy,
- charakteru ruchu oraz wymagań bezpieczeństwa.

---

## Podsumowanie

- Topologia opisuje organizację połączeń w sieci.
- Gwiazda ze switchem dominuje we współczesnych LAN.
- Hierarchie i siatki zapewniają skalowalność lub redundancję, zależnie od potrzeb.

    <script>
      Reveal.initialize({ hash: true, slideNumber: 'c/t', controlsTutorial: false, transition: 'fade', transitionSpeed: 'fast', plugins: [RevealMarkdown] });

      const binary = (value) => value.replace(/[^01]/g, '');
      const setHammingResult = () => {
        const x = document.querySelector('.hamming-x');
        const y = document.querySelector('.hamming-y');
        const output = document.querySelector('.hamming-result');
        if (!x || !y || !output) return;
        x.value = binary(x.value); y.value = binary(y.value);
        if (!x.value || !y.value || x.value.length !== y.value.length) {
          output.textContent = 'Wpisz dwa niepuste ciągi binarne o tej samej długości.';
          return;
        }
        const differences = [...x.value].map((bit, index) => bit === y.value[index] ? null : index + 1).filter(Boolean);
        output.innerHTML = 'Odległość Hamminga: <code>' + differences.length + '</code>. Różne pozycje: <code>' + (differences.join(', ') || 'brak') + '</code>.';
      };

      const twoOfFive = ['00110', '10001', '01001', '11000', '00101', '10100', '01100', '00011', '10010', '01010'];
      const setTwoOfFiveResult = () => {
        const input = document.querySelector('.two-of-five-digit');
        const output = document.querySelector('.two-of-five-result');
        if (!input || !output) return;
        const digit = Math.max(0, Math.min(9, Math.trunc(Number(input.value) || 0)));
        input.value = digit;
        const word = twoOfFive[digit];
        output.innerHTML = 'Cyfra <code>' + digit + '</code> → słowo <code>' + word + '</code>. Liczba jedynek: <code>2</code>.';
      };

      const setTwoOfFiveCheckResult = () => {
        const input = document.querySelector('.two-of-five-word');
        const output = document.querySelector('.two-of-five-check-result');
        if (!input || !output) return;
        input.value = binary(input.value).slice(0, 5);
        if (input.value.length !== 5) {
          output.textContent = 'Wpisz dokładnie pięć bitów.';
          return;
        }
        const weight = [...input.value].filter((bit) => bit === '1').length;
        const digit = twoOfFive.indexOf(input.value);
        if (digit >= 0) {
          output.innerHTML = 'Waga słowa: <code>' + weight + '</code>. Poprawne słowo kodowe cyfry <code>' + digit + '</code>.';
        } else {
          output.innerHTML = 'Waga słowa: <code>' + weight + '</code>. To nie jest słowo kodowe cyfr w użytej tablicy „2 z 5”.';
        }
      };

      const setHdb3Result = () => {
        const input = document.querySelector('.hdb3-input');
        const output = document.querySelector('.hdb3-result');
        if (!input || !output) return;
        input.value = binary(input.value);
        if (!input.value) {
          output.textContent = 'Wpisz co najmniej jeden bit.';
          return;
        }
        let lastPolarity = -1;
        let pulsesSinceViolation = 0;
        let zeroRun = 0;
        const encoded = [];
        for (const character of input.value) {
          if (character === '1') {
            lastPolarity *= -1;
            encoded.push((lastPolarity > 0 ? '+' : '−') + '1');
            pulsesSinceViolation += 1;
            zeroRun = 0;
            continue;
          }
          encoded.push('0');
          zeroRun += 1;
          if (zeroRun !== 4) continue;
          if (pulsesSinceViolation % 2 === 0) {
            const polarity = -lastPolarity;
            lastPolarity = polarity;
            const mark = polarity > 0 ? '+' : '−';
            encoded.splice(-4, 4, mark + 'B', '0', '0', mark + 'V');
          } else {
            const mark = lastPolarity > 0 ? '+' : '−';
            encoded.splice(-4, 4, '0', '0', '0', mark + 'V');
          }
          pulsesSinceViolation = 0;
          zeroRun = 0;
        }
        output.innerHTML = 'Zakodowany przebieg: <code>' + encoded.join(' ') + '</code><br><span><code>B00V</code> lub <code>000V</code> zastępuje serię czterech zer.</span>';
      };

      const setConvolutionalResult = () => {
        const input = document.querySelector('.convolutional-input');
        const output = document.querySelector('.convolutional-result');
        if (!input || !output) return;
        input.value = binary(input.value);
        if (!input.value) {
          output.textContent = 'Wpisz co najmniej jeden bit wejściowy.';
          return;
        }
        let memory1 = 0;
        let memory2 = 0;
        const pairs = [];
        const states = [];
        for (const character of input.value) {
          const bit = Number(character);
          const c1 = bit ^ memory1 ^ memory2;
          const c2 = bit ^ memory2;
          pairs.push('' + c1 + c2);
          states.push('[' + bit + ',' + memory1 + ',' + memory2 + ']');
          memory2 = memory1;
          memory1 = bit;
        }
        output.innerHTML = 'Pary wyjściowe: <code>' + pairs.join(' ') + '</code><br>Stany [bieżący, pamięć 1, pamięć 2]: <code>' + states.join(' ') + '</code>.';
      };

      const initializeLabs = () => {
        document.querySelectorAll('.hamming-x, .hamming-y').forEach((input) => input.addEventListener('input', setHammingResult));
        document.querySelector('.two-of-five-digit')?.addEventListener('input', setTwoOfFiveResult);
        document.querySelector('.two-of-five-word')?.addEventListener('input', setTwoOfFiveCheckResult);
        document.querySelector('.hdb3-input')?.addEventListener('input', setHdb3Result);
        document.querySelector('.convolutional-input')?.addEventListener('input', setConvolutionalResult);
        setHammingResult();
        setTwoOfFiveResult();
        setTwoOfFiveCheckResult();
        setHdb3Result();
        setConvolutionalResult();
      };
      Reveal.on('ready', initializeLabs);
    </script>
